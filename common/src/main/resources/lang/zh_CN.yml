prefix: '<white>[<gradient:#d9afd9:#97d9e1>BaiyuTitle</gradient><white>]<reset> '
command:
  help:
    lines:
    - <gold>―――――― BaiyuTitle 称号插件 帮助 ――――――
    - <yellow>/byt <gray>- 打开装扮管理菜单
    - <yellow>/byt open|repo <gray>- 打开称号仓库
    - <yellow>/byt menu <gray>- 打开装扮管理菜单
    - <yellow>/byt shop <gray>- 打开称号商店
    - <yellow>/byt help <gray>- 显示本帮助
    - <yellow>/byt coin bal [玩家] <gray>- 查询称号币余额
    - <yellow>/byt coin give|set|take <玩家> <数量> <gray>- 管理称号币
    - <yellow>/byt title create|delete|list <gray>- 管理称号目录
    - <yellow>/byt player give|remove|set <gray>- 玩家称号管理
    - <yellow>/byt group create|delete|add|remove|list|info <gray>- 玩家组管理
    - <yellow>/byt admin <gray>- 打开称号管理菜单
    - <yellow>/byt admin order resolve <订单> grant|refund <gray>- 裁决留置订单
    - <yellow>/byt reload <gray>- 重载配置与语言
    - <yellow>/byt trade <gray>- 打开报价列表
    - <yellow>/byt trade history <gray>- 查看个人交易记录
    - <yellow>/byt trade admin [cancel <编号>] <gray>- 全服交易记录/强制销毁报价
    - <yellow>/byt redeem|code <gray>- 铁砧输入兑换码
    - <yellow>/byt redeem create|card|disable <gray>- 兑换码与称号卡管理
  reload:
    success: <green>重载完成：配置与语言已刷新，称号目录已重建（共 <count> 条）。
    failed: <red>重载失败：<reason>，详见控制台日志。
    database-changed: <yellow>检测到 database.yml 有改动：数据库配置需重启服务器才会生效。
  coin:
    balance-self: <green>你的称号币余额：<gold><balance></gold>。
    balance-other: <green>玩家 <yellow><player></yellow> 的称号币余额：<gold><balance></gold>。
    give-success: <green>已给予 <yellow><player></yellow> <gold><amount></gold> 称号币，现余额 <gold><balance></gold>。
    set-success: <green>已将 <yellow><player></yellow> 的称号币设为 <gold><balance></gold>。
    take-success: <green>已扣除 <yellow><player></yellow> <gold><amount></gold> 称号币，现余额 <gold><balance></gold>。
    take-failed: <red>扣除失败：<yellow><player></yellow> 的余额不足（当前 <gold><balance></gold>）。
  title:
    create-success: <green>称号已创建：ID <gold><id></gold>，名称 <name><reset>。
    create-failed: <red>创建失败:<reason>。
    delete-success: <green>称号 <gold><id></gold>（<name><reset>）已删除，历史记录保留。
    delete-failed: <red>删除失败:<reason>。
    list-header: <gold>称号列表（共 <count> 条）：
    list-entry: <gray>#<id> <reset><name>
    list-empty: <yellow>当前没有任何称号，用 <gold>/byt title create <名称></gold> 创建第一个。
  player:
    give-success: <green>已授予 <yellow><player></yellow> 称号 <name><reset>。
    give-already-owned: <yellow><player> 已持有称号 <name><reset>。
    title-not-found: <red>称号 <gold><id></gold> 不存在或已删除。
    remove-success: <green>已收回 <yellow><player></yellow> 的称号 <name><reset>。
    remove-not-owned: <yellow><player> 并未持有称号 <name><reset>。
    set-success: <green>已将 <yellow><player></yellow> 的 <gold><slot></gold> 号栏位设为 <name><reset>。
    set-out-of-range: <red>栏位 <gold><slot></gold> 超出 <yellow><player></yellow> 的可用范围。
    set-not-owned: <red>设置失败：<yellow><player></yellow> 未持有称号 <name><reset>（或称号已删除）。
  admin:
    resolve:
      fulfilled: <green>订单 <gold><order></gold> 已裁决为履约授予。
      refunded: <green>订单 <gold><order></gold> 已裁决为退款补偿。
      manual: <yellow>订单 <gold><order></gold> 仍留置人工（<reason>）。
      already: <yellow>订单 <gold><order></gold> 已被处理，当前状态 <gold><state></gold>。
      unknown: <red>订单 <gold><order></gold> 不存在。
  group:
    create-success: <green>组 <gold><group></gold> 已创建：自动建组称号 <name><reset>（ID <gold><id></gold>），权限节点 <gold><node></gold>
      已注册。
    create-invalid-name: <red>创建失败：名称 <gold><input></gold> 非法（组名限小写字母/数字/下划线，称号名剥色后不超过 50 字符）。
    create-duplicate: <red>创建失败：组名 <gold><group></gold> 已存在（含已删除组，组名不复用）。
    delete-success: <green>组 <gold><group></gold> 已删除：组称号一并删除，共收回 <gold><count></gold> 名持有者（历史记录保留）。
    not-found: <red>组 <gold><group></gold> 不存在或已删除。
    add-success: <green>已将 <yellow><player></yellow> 加入组 <gold><group></gold> 并授予组称号。
    add-already: <yellow><player> 已在组 <gold><group></gold> 中。
    remove-success: <green>已将 <yellow><player></yellow> 移出组 <gold><group></gold> 并收回组称号（若其仍持有组权限，下次登录对账会重新补授）。
    remove-not-member: <yellow><player> 不在组 <gold><group></gold> 的成员表中。
    list-header: <gold>玩家组列表（共 <count> 个）：
    list-entry: <gray>#<id> <reset><group>
    list-empty: <yellow>当前没有任何玩家组，用 <gold>/byt group create <组名></gold> 创建第一个。
    info-header: <gold>组 <group>（ID <id>）：
    info-title: <gray>组称号：<reset><name>
    info-title-missing: <gray>组称号：<red>已删除
    info-members-header: <gray>成员表成员（<count> 人）：
    info-member-entry: <gray>- <reset><player>
    info-members-empty: <gray>成员表为空（仅凭权限的有效成员不在此列）。
  redeem:
    create-success: <green>兑换码已创建：<gold><code></gold>（称号 <name><reset><green>，总量 <uses>，每人 <per>，有效期 <expiry>）。
    card-success: <green>称号卡已发放：<name><reset><green>（持有期 <duration>），请查收背包。
    disable-success: <green>兑换码 <gold><code></gold> 已停用。
    disable-not-found: <red>兑换码 <gold><code></gold> 不存在。
    failed: <red>操作失败：<reason>
    unlimited: 无限
  error:
    no-permission: <red>你没有权限执行此操作。
    player-only: <red>该命令只能由玩家执行。
    invalid-args: <red>参数错误，用法：<usage>
    player-not-found: <red>找不到玩家 <yellow><player></yellow>（从未进入过本服务器）。
    internal: <red>操作失败，详见控制台日志。
bond:
  granted: <green>恭喜！你已集齐羁绊称号 <name><reset> 的全部需求，自动获得该称号！
custom-title:
  announcement: <gold><player></gold> <yellow>创建了专属自定义称号 <name><reset><yellow>！
  notice:
  - <gold>―――――― 自定义称号公告 ――――――
  - <gray>自定义称号支持三种颜色格式：MiniMessage、&#RRGGBB 渐变与传统 & 色码。
  - <gray>需要更高级的自定义方案（图标、简介、稀有度等），请联系服务器管理员。
redeem:
  success: <green>兑换成功：<name><reset><green> 已放入你的仓库。
  reject:
    code-not-found: <red>兑换失败：兑换码不存在。
    code-disabled: <red>兑换失败：该兑换码已停用。
    code-outside-validity: <red>兑换失败：不在该兑换码的有效期内。
    code-exhausted: <red>兑换失败：该兑换码的总用量已耗尽。
    code-player-limit: <red>兑换失败：你已达到该兑换码的使用次数上限。
    card-not-found: <red>兑换失败：称号卡不存在或已失效。
    card-already-redeemed: <red>兑换失败：该称号卡已被使用。
    title-missing: <red>兑换失败：目标称号不存在或已删除。
    already-owned: <yellow>你已拥有该称号，无需重复兑换。
  card:
    item-name: <gold>称号卡：<name>
    item-lore:
    - <aqua> ■ <white>右键使用，兑换称号 <name>
    - '<aqua> ■ <white>持有期: <yellow><duration>'
    - '<aqua> ■ <white>发卡人: <yellow><issuer>'
    duration-default: 按称号默认
