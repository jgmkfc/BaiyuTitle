prefix: '<white>[<gradient:#d9afd9:#97d9e1>BaiyuTitle</gradient><white>]<reset> '
command:
  help:
    lines:
    - <gold>―――――― BaiyuTitle Help ――――――
    - <yellow>/byt <gray>- Open the wardrobe menu
    - <yellow>/byt open|repo <gray>- Open the title repository
    - <yellow>/byt menu <gray>- Open the wardrobe menu
    - <yellow>/byt shop <gray>- Open the title shop
    - <yellow>/byt help <gray>- Show this help
    - <yellow>/byt coin bal [player] <gray>- Check coin balance
    - <yellow>/byt coin give|set|take <player> <amount> <gray>- Manage coins
    - <yellow>/byt title create|delete|list <gray>- Manage title catalog
    - <yellow>/byt player give|remove|set <gray>- Manage player titles
    - <yellow>/byt group create|delete|add|remove|list|info <gray>- Manage player groups
    - <yellow>/byt admin <gray>- Open the title management menu
    - <yellow>/byt admin order resolve <order> grant|refund <gray>- Resolve a held order
    - <yellow>/byt reload <gray>- Reload config and languages
    - <yellow>/byt trade <gray>- Open the trade offer list
    - <yellow>/byt trade history <gray>- View your trade history
    - <yellow>/byt trade admin [cancel <offer>] <gray>- Global trade log / force-destroy an offer
    - <yellow>/byt redeem|code <gray>- Enter a redeem code via the anvil UI
    - <yellow>/byt redeem create|card|disable <gray>- Manage redeem codes and title cards
  reload:
    success: '<green>Reload complete: config and languages refreshed, title catalog rebuilt (<count> entries).'
    failed: '<red>Reload failed: <reason>. See console log for details.'
    database-changed: '<yellow>database.yml has changed: database settings require a server restart to take effect.'
  coin:
    balance-self: '<green>Your coin balance: <gold><balance></gold>.'
    balance-other: '<green>Coin balance of <yellow><player></yellow>: <gold><balance></gold>.'
    give-success: <green>Gave <gold><amount></gold> coins to <yellow><player></yellow>, new balance <gold><balance></gold>.
    set-success: <green>Set <yellow><player></yellow>'s coin balance to <gold><balance></gold>.
    take-success: <green>Took <gold><amount></gold> coins from <yellow><player></yellow>, new balance <gold><balance></gold>.
    take-failed: '<red>Failed to take coins: <yellow><player></yellow> has insufficient balance (current <gold><balance></gold>).'
  title:
    create-success: '<green>Title created: ID <gold><id></gold>, name <name><reset>.'
    create-failed: '<red>Creation failed: <reason>.'
    delete-success: <green>Title <gold><id></gold> (<name><reset>) deleted; history is kept.
    delete-failed: '<red>Deletion failed: <reason>.'
    list-header: '<gold>Titles (<count> total):'
    list-entry: <gray>#<id> <reset><name>
    list-empty: <yellow>No titles yet. Use <gold>/byt title create <name></gold> to create one.
  player:
    give-success: <green>Granted title <name><reset> to <yellow><player></yellow>.
    give-already-owned: <yellow><player> already owns title <name><reset>.
    title-not-found: <red>Title <gold><id></gold> does not exist or has been deleted.
    remove-success: <green>Revoked title <name><reset> from <yellow><player></yellow>.
    remove-not-owned: <yellow><player> does not own title <name><reset>.
    set-success: <green>Set slot <gold><slot></gold> of <yellow><player></yellow> to <name><reset>.
    set-out-of-range: <red>Slot <gold><slot></gold> is out of range for <yellow><player></yellow>.
    set-not-owned: '<red>Failed: <yellow><player></yellow> does not own title <name><reset> (or it has been deleted).'
  admin:
    resolve:
      fulfilled: '<green>Order <gold><order></gold> resolved: title granted.'
      refunded: '<green>Order <gold><order></gold> resolved: payment refunded.'
      manual: <yellow>Order <gold><order></gold> is still held for manual review (<reason>).
      already: <yellow>Order <gold><order></gold> was already handled; current state <gold><state></gold>.
      unknown: <red>Order <gold><order></gold> does not exist.
  group:
    create-success: '<green>Group <gold><group></gold> created: group title <name><reset> (ID <gold><id></gold>) auto-created,
      permission node <gold><node></gold> registered.'
    create-invalid-name: '<red>Creation failed: name <gold><input></gold> is invalid (group names allow lowercase letters/digits/underscores;
      title names must be at most 50 characters after stripping colors).'
    create-duplicate: '<red>Creation failed: group name <gold><group></gold> already exists (including deleted groups; names
      are never reused).'
    delete-success: '<green>Group <gold><group></gold> deleted: its group title was deleted too, revoked from <gold><count></gold>
      holders (history is kept).'
    not-found: <red>Group <gold><group></gold> does not exist or has been deleted.
    add-success: <green>Added <yellow><player></yellow> to group <gold><group></gold> and granted the group title.
    add-already: <yellow><player> is already in group <gold><group></gold>.
    remove-success: <green>Removed <yellow><player></yellow> from group <gold><group></gold> and revoked the group title (if
      they still hold the group permission, the next login reconcile will re-grant it).
    remove-not-member: <yellow><player> is not in the member table of group <gold><group></gold>.
    list-header: '<gold>Player groups (<count> total):'
    list-entry: <gray>#<id> <reset><group>
    list-empty: <yellow>No player groups yet. Use <gold>/byt group create <name></gold> to create one.
    info-header: '<gold>Group <group> (ID <id>):'
    info-title: '<gray>Group title: <reset><name>'
    info-title-missing: '<gray>Group title: <red>deleted'
    info-members-header: '<gray>Member-table members (<count>):'
    info-member-entry: <gray>- <reset><player>
    info-members-empty: <gray>The member table is empty (permission-only members are not listed here).
  redeem:
    create-success: '<green>Redeem code created: <gold><code></gold> (title <name><reset><green>, total uses <uses>, per player
      <per>, validity <expiry>).'
    card-success: '<green>Title card issued: <name><reset><green> (hold period <duration>). Check your inventory.'
    disable-success: <green>Redeem code <gold><code></gold> has been disabled.
    disable-not-found: <red>Redeem code <gold><code></gold> does not exist.
    failed: '<red>Operation failed: <reason>'
    unlimited: Unlimited
  error:
    no-permission: <red>You don't have permission to do that.
    player-only: <red>This command can only be used by a player.
    invalid-args: '<red>Invalid arguments. Usage: <usage>'
    player-not-found: <red>Player <yellow><player></yellow> not found (never joined this server).
    internal: <red>Operation failed. See console log for details.
bond:
  granted: <green>Congratulations! You collected every title required by the bond title <name><reset> and received it automatically!
custom-title:
  announcement: <gold><player></gold> <yellow>created their exclusive custom title <name><reset><yellow>!
  notice:
  - <gold>―――――― Custom Title Notice ――――――
  - '<gray>Custom titles support three color formats: MiniMessage, &#RRGGBB gradients and legacy & codes.'
  - <gray>For advanced customization (icon, description, rarity, ...), please contact a server admin.
redeem:
  success: '<green>Redeemed: <name><reset><green> has been added to your repository.'
  reject:
    code-not-found: '<red>Redeem failed: the code does not exist.'
    code-disabled: '<red>Redeem failed: this code has been disabled.'
    code-outside-validity: '<red>Redeem failed: outside this code''s validity window.'
    code-exhausted: '<red>Redeem failed: this code has no uses left.'
    code-player-limit: '<red>Redeem failed: you reached the per-player use limit of this code.'
    card-not-found: '<red>Redeem failed: the title card does not exist or is invalid.'
    card-already-redeemed: '<red>Redeem failed: this title card has already been used.'
    title-missing: '<red>Redeem failed: the target title does not exist or has been deleted.'
    already-owned: <yellow>You already own this title; no need to redeem it again.
  card:
    item-name: '<gold>Title Card: <name>'
    item-lore:
    - <aqua> ■ <white>Right-click to redeem title <name>
    - '<aqua> ■ <white>Hold period: <yellow><duration>'
    - '<aqua> ■ <white>Issued by: <yellow><issuer>'
    duration-default: Title default
