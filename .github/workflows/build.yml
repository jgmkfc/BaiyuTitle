name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # wrapper 里配的是国内镜像，GitHub 的机器访问不到，临时换成官方源
      - name: Point Gradle wrapper to official distribution
        run: |
          sed -i 's|mirrors.tuna.tsinghua.edu.cn/gradle-distributions|services.gradle.org/distributions|' \
            gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Upload plugin jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BaiYuTitle-jar
          path: |
            paper/build/libs/*.jar
            !paper/build/libs/*-sources.jar
            !paper/build/libs/*-javadoc.jar
          retention-days: 14

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: '**/build/reports/tests/'
          retention-days: 7
